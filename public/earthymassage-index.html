<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earthy Massage Has Moved</title>
  <meta name="description" content="Earthy Massage has moved to Earthy Wellness. Please update your bookmarks.">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Lato', 'Segoe UI', sans-serif;
      background: #f9f6f2;
      color: #4a4a4a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 520px;
      background: #ffffff;
      padding: 48px 36px;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      color: #a83f5c;
      font-size: 2rem;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 16px;
    }
    .btn {
      display: inline-block;
      background: #a83f5c;
      color: #ffffff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 6px;
      font-size: 1rem;
      margin-top: 12px;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background: #8b324c;
    }
    .note {
      font-size: 0.9rem;
      color: #777;
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Earthy Massage Has Moved</h1>
    <p>
      The website has moved to a new home. Please update your bookmarks and visit us at the new address below.
    </p>
    <a href="https://www.earthy-wellness.com/" class="btn">Go to earthy-wellness.com</a>
    <p class="note">
      https://www.earthy-wellness.com/
    </p>
  </div>
</body>
</html>
